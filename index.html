<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>The Nickname Atlas of Southeast Asia</title>
</head>

<body>

    <div class="hero">
        <p class="subtitle">ELEVEN NATIONS • ONE REGION</p>
        <h1>The <span>Nickname</span><br>Atlas of Southeast Asia</h1>
        <p class="description">Explore the names and identities of Southeast Asia.</p>
    </div>

    <div class="container">
        <div class="lookup-card">
            <p class="section-label">COUNTRY LOOKUP</p>
            <h2>Choose a country</h2>

            <select id="country" class="form-select">
                <option value="0">Brunei</option>
                <option value="1">Cambodia</option>
                <option value="2">Indonesia</option>
                <option value="3">Laos</option>
                <option value="4">Malaysia</option>
                <option value="5">Myanmar (Burma)</option>
                <option value="6">Philippines</option>
                <option value="7">Singapore</option>
                <option value="8">Thailand</option>
                <option value="9">Timor-Leste (East Timor)</option>
                <option value="10">Vietnam</option>
            </select>

            <button class="btn btn-atlas" py-click="show_nickname">REVEAL NICKNAME</button>
            <div id="result"></div>
        </div>
    </div>

    <footer>Nickname Atlas • ICT 10 • Second Quarter</footer>

    <py-script src="main.py"></py-script>

</body>
</html>
